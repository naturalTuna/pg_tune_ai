name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 16 + hypopg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-hypopg
          sudo pg_ctlcluster 16 main start || true
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
      - name: unit tests
        run: python3 -m unittest discover -s tests -v
      - name: integration tests
        env:
          PGTUNE_TEST_DSN: "host=localhost port=5432 user=postgres password=postgres dbname=postgres"
        run: python3 -m unittest tests.test_integration -v
